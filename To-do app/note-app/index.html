<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planify — Task Manager</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #161616;
        --card: #1c1c1e;
        --card-hover: #222226;
        --border: #2a2a2e;
        --accent: #c9a84c;
        --accent-dim: rgba(201, 168, 76, 0.12);
        --accent-glow: rgba(201, 168, 76, 0.25);
        --text: #f0ede8;
        --text-muted: #7a7673;
        --text-dim: #4a4744;
        --danger: #c0392b;
        --danger-dim: rgba(192, 57, 43, 0.12);
        --green: #27ae60;
        --green-dim: rgba(39, 174, 96, 0.12);
        --blue: #2980b9;
        --purple: #8e44ad;
        --radius: 12px;
        --radius-sm: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Ambient background effect */
      body::before {
        content: "";
        position: fixed;
        top: -30%;
        left: -20%;
        width: 60%;
        height: 70%;
        background: radial-gradient(
          ellipse,
          rgba(201, 168, 76, 0.04) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      body::after {
        content: "";
        position: fixed;
        bottom: -20%;
        right: -10%;
        width: 50%;
        height: 60%;
        background: radial-gradient(
          ellipse,
          rgba(41, 128, 185, 0.04) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      /* ──────────── Layout ──────────── */
      .app-wrapper {
        position: relative;
        z-index: 1;
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      /* ──────────── Header ──────────── */
      header {
        margin-bottom: 48px;
        animation: fadeSlideDown 0.6s ease both;
      }

      .header-top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .logo {
        font-family: "Playfair Display", serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -1px;
        color: var(--text);
        line-height: 1;
      }

      .logo span {
        color: var(--accent);
      }

      .date-badge {
        font-size: 12px;
        font-weight: 300;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding-bottom: 4px;
      }

      .header-divider {
        height: 1px;
        background: linear-gradient(90deg, var(--accent) 0%, var(--border) 60%);
        margin-bottom: 20px;
      }

      .stats-row {
        display: flex;
        gap: 28px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-number {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 600;
        color: var(--accent);
        line-height: 1;
      }

      .stat-label {
        font-size: 11px;
        font-weight: 400;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ──────────── Input Panel ──────────── */
      .input-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 32px;
        animation: fadeSlideDown 0.6s 0.1s ease both;
        transition: border-color 0.3s;
      }

      .input-panel:focus-within {
        border-color: rgba(201, 168, 76, 0.4);
      }

      .panel-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 16px;
      }

      .task-input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 14px;
      }

      .task-input-wrap {
        flex: 1;
        position: relative;
      }

      .task-input-wrap .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        font-size: 15px;
        pointer-events: none;
      }

      input[type="text"],
      input[type="date"],
      select {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        font-weight: 400;
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        width: 100%;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        appearance: none;
        -webkit-appearance: none;
      }

      #newTaskInput {
        padding-left: 40px;
      }

      input[type="text"]::placeholder {
        color: var(--text-dim);
      }

      input[type="text"]:focus,
      input[type="date"]:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.5);
        cursor: pointer;
      }

      select option {
        background: var(--card);
        color: var(--text);
      }

      .meta-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .add-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #0f0f0f;
        border: none;
        border-radius: var(--radius-sm);
        padding: 12px 20px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.2s,
          background 0.2s;
        white-space: nowrap;
      }

      .add-btn:hover {
        background: #d4b560;
        box-shadow: 0 6px 20px var(--accent-glow);
        transform: translateY(-1px);
      }

      .add-btn:active {
        transform: translateY(0);
      }

      /* ──────────── Filter Bar ──────────── */
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        animation: fadeSlideDown 0.6s 0.2s ease both;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        padding: 7px 14px;
        border-radius: 100px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .filter-btn:hover {
        color: var(--text);
        border-color: var(--text-dim);
      }
      .filter-btn.active {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
      }

      .filter-spacer {
        flex: 1;
      }

      .search-wrap {
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        font-size: 13px;
      }

      #searchInput {
        padding: 7px 12px 7px 30px;
        width: 180px;
        font-size: 13px;
        border-radius: 100px;
      }

      /* ──────────── Section Heading ──────────── */
      .section-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        margin-top: 28px;
      }

      .section-heading:first-of-type {
        margin-top: 0;
      }

      .section-title {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .section-line {
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .section-count {
        font-size: 11px;
        color: var(--text-dim);
      }

      /* ──────────── Task Card ──────────── */
      #taskList {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .task {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s,
          opacity 0.3s;
        animation: taskEnter 0.35s ease both;
        cursor: default;
      }

      .task:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        border-color: #333;
      }

      .task.completed {
        opacity: 0.45;
      }

      .task.completed .task-title {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .task.near-due {
        border-left: 3px solid #c0392b;
      }

      .task.removing {
        animation: taskExit 0.3s ease forwards;
      }

      /* Checkbox */
      .checkbox-wrap {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .checkbox-wrap input[type="checkbox"] {
        display: none;
      }

      .custom-check {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        background: transparent;
      }

      .custom-check:hover {
        border-color: var(--accent);
      }

      .custom-check.checked {
        background: var(--green);
        border-color: var(--green);
      }

      .custom-check.checked::after {
        content: "✓";
        color: white;
        font-size: 11px;
        font-weight: 700;
      }

      /* Task content */
      .task-body {
        flex: 1;
        min-width: 0;
      }

      .task-title {
        font-size: 15px;
        font-weight: 400;
        color: var(--text);
        margin-bottom: 6px;
        line-height: 1.4;
        word-break: break-word;
      }

      .task-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        padding: 3px 9px;
        border-radius: 100px;
        letter-spacing: 0.3px;
      }

      .badge-priority-High {
        background: rgba(192, 57, 43, 0.15);
        color: #e74c3c;
        border: 1px solid rgba(192, 57, 43, 0.25);
      }
      .badge-priority-Medium {
        background: rgba(230, 126, 34, 0.15);
        color: #e67e22;
        border: 1px solid rgba(230, 126, 34, 0.25);
      }
      .badge-priority-Low {
        background: rgba(39, 174, 96, 0.12);
        color: #2ecc71;
        border: 1px solid rgba(39, 174, 96, 0.2);
      }

      .badge-category {
        background: rgba(52, 152, 219, 0.12);
        color: #3498db;
        border: 1px solid rgba(52, 152, 219, 0.2);
      }
      .badge-study {
        background: rgba(142, 68, 173, 0.12);
        color: #9b59b6;
        border: 1px solid rgba(142, 68, 173, 0.2);
      }
      .badge-personal {
        background: rgba(26, 188, 156, 0.12);
        color: #1abc9c;
        border: 1px solid rgba(26, 188, 156, 0.2);
      }

      .due-date {
        font-size: 11px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .due-date.overdue {
        color: #e74c3c;
      }
      .due-date.soon {
        color: #e67e22;
      }

      /* Task actions */
      .task-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .task:hover .task-actions {
        opacity: 1;
      }

      .action-btn {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
      }

      .action-btn:hover {
        color: var(--text);
        border-color: #444;
        background: var(--card-hover);
      }
      .action-btn.del:hover {
        color: #e74c3c;
        border-color: rgba(231, 76, 60, 0.4);
        background: rgba(231, 76, 60, 0.08);
      }

      /* ──────────── Empty State ──────────── */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-dim);
        animation: fadeSlideDown 0.5s ease both;
      }

      .empty-state .empty-icon {
        font-size: 40px;
        margin-bottom: 16px;
        opacity: 0.3;
      }

      .empty-state p {
        font-size: 14px;
        font-style: italic;
        font-family: "Playfair Display", serif;
        color: var(--text-muted);
      }

      /* ──────────── Progress Bar ──────────── */
      .progress-wrap {
        margin-bottom: 32px;
        animation: fadeSlideDown 0.6s 0.15s ease both;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .progress-label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 400;
      }

      .progress-pct {
        font-family: "Playfair Display", serif;
        font-size: 14px;
        color: var(--accent);
      }

      .progress-track {
        height: 3px;
        background: var(--border);
        border-radius: 100px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #e8c96e);
        border-radius: 100px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ──────────── Toast ──────────── */
      .toast-container {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        color: var(--text);
        font-size: 13px;
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        animation: toastIn 0.3s ease both;
        max-width: 280px;
      }

      .toast.removing {
        animation: toastOut 0.3s ease forwards;
      }

      /* ──────────── Animations ──────────── */
      @keyframes fadeSlideDown {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes taskEnter {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes taskExit {
        to {
          opacity: 0;
          transform: translateX(10px) scale(0.97);
        }
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateX(20px);
        }
      }

      /* ──────────── Responsive ──────────── */
      @media (max-width: 580px) {
        .meta-row {
          grid-template-columns: 1fr 1fr;
        }
        .add-btn {
          grid-column: span 2;
          justify-content: center;
        }
        .task-input-row {
          flex-direction: column;
        }
        .header-top {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Header -->
      <header>
        <div class="header-top">
          <div class="logo">Planify<span>.</span></div>
          <div class="date-badge" id="headerDate"></div>
        </div>
        <div class="header-divider"></div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat">
            <div class="stat-number" id="statDone">0</div>
            <div class="stat-label">Done</div>
          </div>
          <div class="stat">
            <div class="stat-number" id="statPending">0</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat">
            <div class="stat-number" id="statOverdue">0</div>
            <div class="stat-label">Overdue</div>
          </div>
        </div>
      </header>

      <!-- Progress -->
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Daily progress</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>

      <!-- Input Panel -->
      <div class="input-panel">
        <div class="panel-label">New Task</div>
        <div class="task-input-row">
          <div class="task-input-wrap">
            <span class="input-icon">✦</span>
            <input
              type="text"
              id="newTaskInput"
              placeholder="What needs to be done?"
              autocomplete="off"
            />
          </div>
        </div>
        <div class="meta-row">
          <input type="date" id="dueDateInput" />
          <select id="priorityInput">
            <option value="Low">↓ Low</option>
            <option value="Medium" selected>→ Medium</option>
            <option value="High">↑ High</option>
          </select>
          <select id="categoryInput">
            <option value="Work">💼 Work</option>
            <option value="Personal">🌿 Personal</option>
            <option value="Study">📖 Study</option>
          </select>
          <button class="add-btn" id="addTaskBtn"><span>+</span> Add</button>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Done</button>
        <button class="filter-btn" data-filter="High">🔥 High</button>
        <button class="filter-btn" data-filter="Work">Work</button>
        <button class="filter-btn" data-filter="Personal">Personal</button>
        <button class="filter-btn" data-filter="Study">Study</button>
        <div class="filter-spacer"></div>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="searchInput" placeholder="Search tasks..." />
        </div>
      </div>

      <!-- Task List -->
      <div id="taskList"></div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
      // ── State ──────────────────────────────────────────────────────────────────
      let tasks = JSON.parse(localStorage.getItem("opus_tasks") || "[]");
      let currentFilter = "all";
      let searchQuery = "";

      // ── Helpers ────────────────────────────────────────────────────────────────
      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2);
      const save = () =>
        localStorage.setItem("opus_tasks", JSON.stringify(tasks));

      function getDueMeta(dateStr) {
        if (!dateStr) return null;
        const due = new Date(dateStr + "T00:00:00");
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diff = Math.round((due - today) / 86400000);
        if (diff < 0)
          return { label: `${Math.abs(diff)}d overdue`, cls: "overdue" };
        if (diff === 0) return { label: "Due today", cls: "soon" };
        if (diff === 1) return { label: "Due tomorrow", cls: "soon" };
        if (diff <= 3) return { label: `In ${diff} days`, cls: "soon" };
        return {
          label: due.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          }),
          cls: "",
        };
      }

      function getCategoryBadgeClass(cat) {
        if (cat === "Study") return "badge-study";
        if (cat === "Personal") return "badge-personal";
        return "badge-category";
      }

      // ── Toast ──────────────────────────────────────────────────────────────────
      function showToast(msg) {
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = msg;
        document.getElementById("toastContainer").appendChild(el);
        setTimeout(() => {
          el.classList.add("removing");
          el.addEventListener("animationend", () => el.remove());
        }, 2500);
      }

      // ── Date header ───────────────────────────────────────────────────────────
      function setDate() {
        const d = new Date();
        document.getElementById("headerDate").textContent = d
          .toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
          })
          .toUpperCase();
      }

      // ── Stats ──────────────────────────────────────────────────────────────────
      function updateStats() {
        const total = tasks.length;
        const done = tasks.filter((t) => t.completed).length;
        const pending = total - done;
        const overdue = tasks.filter((t) => {
          if (t.completed || !t.dueDate) return false;
          const due = new Date(t.dueDate + "T00:00:00");
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          return due < today;
        }).length;
        document.getElementById("statTotal").textContent = total;
        document.getElementById("statDone").textContent = done;
        document.getElementById("statPending").textContent = pending;
        document.getElementById("statOverdue").textContent = overdue;
        const pct = total ? Math.round((done / total) * 100) : 0;
        document.getElementById("progressPct").textContent = pct + "%";
        document.getElementById("progressFill").style.width = pct + "%";
      }

      // ── Render ─────────────────────────────────────────────────────────────────
      function getFilteredTasks() {
        return tasks.filter((t) => {
          // search
          if (
            searchQuery &&
            !t.title.toLowerCase().includes(searchQuery.toLowerCase())
          )
            return false;
          // filter
          if (currentFilter === "pending") return !t.completed;
          if (currentFilter === "completed") return t.completed;
          if (currentFilter === "High")
            return t.priority === "High" && !t.completed;
          if (["Work", "Personal", "Study"].includes(currentFilter))
            return t.category === currentFilter;
          return true;
        });
      }

      function buildTaskEl(task) {
        const dueMeta = getDueMeta(task.dueDate);
        const isNearDue =
          dueMeta && (dueMeta.cls === "soon" || dueMeta.cls === "overdue");

        const div = document.createElement("div");
        div.className =
          "task" +
          (task.completed ? " completed" : "") +
          (isNearDue && !task.completed ? " near-due" : "");
        div.dataset.id = task.id;

        div.innerHTML = `
      <div class="checkbox-wrap">
        <label>
          <input type="checkbox" ${task.completed ? "checked" : ""}>
          <div class="custom-check ${task.completed ? "checked" : ""}"></div>
        </label>
      </div>
      <div class="task-body">
        <div class="task-title">${escapeHtml(task.title)}</div>
        <div class="task-meta">
          <span class="badge badge-priority-${task.priority}">${task.priority}</span>
          <span class="badge ${getCategoryBadgeClass(task.category)}">${task.category}</span>
          ${dueMeta ? `<span class="due-date ${dueMeta.cls}">⏰ ${dueMeta.label}</span>` : ""}
        </div>
      </div>
      <div class="task-actions">
        <button class="action-btn del" title="Delete" data-action="delete">✕</button>
      </div>
    `;

        // Checkbox toggle
        const chkEl = div.querySelector('input[type="checkbox"]');
        const chkVis = div.querySelector(".custom-check");
        chkEl.addEventListener("change", () => {
          task.completed = chkEl.checked;
          save();
          renderAll();
          showToast(task.completed ? "Task completed ✓" : "Task reopened");
        });

        // Delete
        div
          .querySelector('[data-action="delete"]')
          .addEventListener("click", () => {
            div.classList.add("removing");
            div.addEventListener("animationend", () => {
              tasks = tasks.filter((t) => t.id !== task.id);
              save();
              renderAll();
              showToast("Task removed");
            });
          });

        return div;
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderAll() {
        const list = document.getElementById("taskList");
        list.innerHTML = "";
        const filtered = getFilteredTasks();

        if (filtered.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = `<div class="empty-icon">✦</div><p>No tasks here — a clear mind awaits.</p>`;
          list.appendChild(empty);
        } else {
          // Pending section
          const pending = filtered.filter((t) => !t.completed);
          const done = filtered.filter((t) => t.completed);

          if (pending.length > 0) {
            const heading = document.createElement("div");
            heading.className = "section-heading";
            heading.innerHTML = `<span class="section-title">Pending</span><div class="section-line"></div><span class="section-count">${pending.length}</span>`;
            list.appendChild(heading);
            pending.forEach((t) => list.appendChild(buildTaskEl(t)));
          }

          if (done.length > 0) {
            const heading = document.createElement("div");
            heading.className = "section-heading";
            heading.innerHTML = `<span class="section-title">Completed</span><div class="section-line"></div><span class="section-count">${done.length}</span>`;
            list.appendChild(heading);
            done.forEach((t) => list.appendChild(buildTaskEl(t)));
          }
        }

        updateStats();
      }

      // ── Add task ───────────────────────────────────────────────────────────────
      function addTask() {
        const title = document.getElementById("newTaskInput").value.trim();
        if (!title) {
          document.getElementById("newTaskInput").focus();
          document.getElementById("newTaskInput").style.borderColor = "#e74c3c";
          setTimeout(
            () =>
              (document.getElementById("newTaskInput").style.borderColor = ""),
            1500,
          );
          return;
        }
        tasks.unshift({
          id: uid(),
          title,
          dueDate: document.getElementById("dueDateInput").value || null,
          priority: document.getElementById("priorityInput").value,
          category: document.getElementById("categoryInput").value,
          completed: false,
          createdAt: Date.now(),
        });
        document.getElementById("newTaskInput").value = "";
        document.getElementById("dueDateInput").value = "";
        save();
        renderAll();
        showToast("Task added ✦");
      }

      // ── Events ─────────────────────────────────────────────────────────────────
      document.getElementById("addTaskBtn").addEventListener("click", addTask);
      document
        .getElementById("newTaskInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") addTask();
        });

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          renderAll();
        });
      });

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderAll();
      });

      // ── Init ───────────────────────────────────────────────────────────────────
      setDate();
      renderAll();
    </script>
  </body>
</html>
